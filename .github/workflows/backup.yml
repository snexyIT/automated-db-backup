name: Automated Database Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Reset MySQL Test Environment
        run: |
          docker compose down -v --remove-orphans
          docker compose up -d mysql

      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL..."

          for i in {1..30}; do
            if docker exec mysql-db mysqladmin ping -uroot -proot123 --silent; then
              echo "MySQL is ready."
              exit 0
            fi

            echo "MySQL is not ready yet. Attempt $i/30..."
            sleep 2
          done

          echo "MySQL failed to become ready."
          docker logs mysql-db
          exit 1

      - name: Restore Existing Database
        run: |
          echo "Loading existing database backup..."

          docker exec -i mysql-db mysql -uroot -proot123 backupdb < backups/backup.sql

          echo "Existing database backup loaded successfully."

      - name: Verify Initial Data
        run: |
          COUNT=$(docker exec mysql-db mysql -uroot -proot123 -N -e "USE backupdb; SELECT COUNT(*) FROM students;")

          echo "Initial student count: $COUNT"

          if [ "$COUNT" -eq 3 ]; then
            echo "Initial data verification successful: 3 records found."
          else
            echo "Initial data verification failed: expected 3 records, found $COUNT."
            exit 1
          fi

      - name: Create Backup Folder
        run: mkdir -p backups/generated

      - name: Create Database Backup
        run: |
          docker exec mysql-db mysqldump -uroot -proot123 backupdb > backups/generated/backup.sql
          echo "Database backup created successfully."

      - name: Verify Backup
        run: |
          if [ -s backups/generated/backup.sql ]; then
            echo "Backup verification successful."
            ls -lh backups/generated/backup.sql
          else
            echo "Backup verification failed."
            exit 1
          fi

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-backup
          path: backups/generated/backup.sql

      - name: Test Database Restore
        run: |
          echo "Clearing test data..."

          docker exec mysql-db mysql -uroot -proot123 -e "USE backupdb; TRUNCATE TABLE students;"

          echo "Verifying table is empty..."

          COUNT=$(docker exec mysql-db mysql -uroot -proot123 -N -e "USE backupdb; SELECT COUNT(*) FROM students;")

          if [ "$COUNT" -eq 0 ]; then
            echo "Students table successfully cleared."
          else
            echo "Failed to clear students table. Found $COUNT records."
            exit 1
          fi

          echo "Restoring database from generated backup..."

          docker exec -i mysql-db mysql -uroot -proot123 backupdb < backups/generated/backup.sql

          echo "Verifying restored data..."

          COUNT=$(docker exec mysql-db mysql -uroot -proot123 -N -e "USE backupdb; SELECT COUNT(*) FROM students;")

          echo "Restored student count: $COUNT"

          if [ "$COUNT" -eq 3 ]; then
            echo "Restore verification successful: 3 records recovered."
          else
            echo "Restore verification failed: expected 3 records, found $COUNT."
            exit 1
          fi

      - name: Stop MySQL
        if: always()
        run: docker compose down -v